<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verifica disponibilità | Wedding Tattoo Experience</title>
<style>
:root{--gold:#c99a36;--gold2:#f0cf75;--bg:#050505;--card:#111;--text:#f5f2ea}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0a0a0a,#020202);color:var(--text);font-family:Arial,sans-serif}
.wrap{max-width:700px;margin:auto;padding:24px}
h1{font-family:Georgia,serif;color:var(--gold2);font-weight:400}
p{color:#d4cab8}
label{display:block;margin:16px 0 6px;color:var(--gold2);font-size:13px}
input,select,textarea{
width:100%;padding:14px;border-radius:12px;
border:1px solid #444;background:#151515;color:#fff;font-size:16px}
textarea{min-height:120px;resize:vertical}
button{
margin-top:22px;width:100%;padding:16px;border:0;border-radius:999px;
background:linear-gradient(135deg,#e6c56c,#c99a36);
color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.back{display:inline-block;margin-bottom:20px;color:var(--gold2);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Torna al catalogo</a>
<h1>Verifica disponibilità</h1>
<p>Compila il modulo. Si aprirà WhatsApp con la richiesta già compilata.</p>

<form id="f">
<label>Nomi degli sposi *</label>
<input id="names" required>

<label>Data matrimonio *</label>
<input id="date" type="date" required>

<label>Location *</label>
<input id="place" required>

<label>Numero invitati</label>
<input id="guests" type="number">

<label>Pacchetto</label>
<select id="pack">
<option>Da definire</option>
<option>Bronze</option>
<option>Silver</option>
<option>Gold</option>
</select>

<label>Telefono *</label>
<input id="phone" type="tel" required>

<label>Email</label>
<input id="mail" type="email">

<label>Note</label>
<textarea id="notes"></textarea>

<button type="submit">Invia richiesta su WhatsApp</button>
</form>
</div>

<script>
document.getElementById("f").addEventListener("submit",function(e){
e.preventDefault();
const t=`💍 NUOVA RICHIESTA WEDDING TATTOO EXPERIENCE

👰 Sposi: ${names.value}
📅 Data: ${date.value}
📍 Location: ${place.value}
👥 Invitati: ${guests.value||"Da definire"}
🎁 Pacchetto: ${pack.value}
📞 Telefono: ${phone.value}
📧 Email: ${mail.value||"Non indicata"}

📝 Note:
${notes.value||"Nessuna"}`;
window.open("https://wa.me/393477050250?text="+encodeURIComponent(t),"_blank");
});
</script>
</body>
</html>
