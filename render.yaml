services:
  - type: web
    name: wedding-book-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-book-crm-db
          property: connectionString
      - key: CRM_USER
        sync: false
      - key: CRM_PASSWORD
        sync: false

databases:
  - name: wedding-book-crm-db
    plan: free
    databaseName: wedding_book_crm
    user: wedding_book_crm
